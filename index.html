<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Nutrient Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-100 min-h-screen">
    <div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
    const { useState } = React;

    function PlantAnalyzer() {
        const [selectedImage, setSelectedImage] = useState(null);
        const [imagePreview, setImagePreview] = useState(null);
        const [analysis, setAnalysis] = useState(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState(null);

        const handleImageSelect = (e) => {
            const file = e.target.files[0];
            if (file) {
                setSelectedImage(file);
                setError(null);
                setAnalysis(null);
                
                const reader = new FileReader();
                reader.onloadend = () => {
                    setImagePreview(reader.result);
                };
                reader.readAsDataURL(file);
            }
        };

        const analyzeImage = async () => {
            if (!selectedImage) return;

            setLoading(true);
            setError(null);
            setAnalysis(null);

            try {
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64Data = reader.result.split(',')[1];
                    
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 1000,
                            messages: [{
                                role: 'user',
                                content: [
                                    {
                                        type: 'image',
                                        source: {
                                            type: 'base64',
                                            media_type: selectedImage.type,
                                            data: base64Data
                                        }
                                    },
                                    {
                                        type: 'text',
                                        text: `Analyze this plant photo for nutrient deficiencies. Provide your analysis in the following JSON format only, with no other text:
```

{
“plantType”: “estimated plant type or ‘Unknown’”,
“overallHealth”: “poor/fair/good/excellent”,
“deficiencies”: [
{
“nutrient”: “nutrient name”,
“severity”: “mild/moderate/severe”,
“symptoms”: “observed symptoms”,
“confidence”: “low/medium/high”
}
],
“recommendations”: [
“specific recommendation 1”,
“specific recommendation 2”
],
“additionalNotes”: “any other relevant observations”
}`
}
]
}]
})
});

```
                    if (!response.ok) {
                        throw new Error(`API error: ${response.status}`);
                    }

                    const data = await response.json();
                    const textContent = data.content.find(c => c.type === 'text')?.text || '';
                    
                    const jsonMatch = textContent.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        const parsedAnalysis = JSON.parse(jsonMatch[0]);
                        setAnalysis(parsedAnalysis);
                    } else {
                        throw new Error('Could not parse analysis response');
                    }
                    
                    setLoading(false);
                };
                
                reader.readAsDataURL(selectedImage);
            } catch (err) {
                setError(err.message || 'Failed to analyze image');
                setLoading(false);
            }
        };

        const getSeverityColor = (severity) => {
            switch(severity?.toLowerCase()) {
                case 'mild': return 'bg-yellow-100 text-yellow-800 border-yellow-300';
                case 'moderate': return 'bg-orange-100 text-orange-800 border-orange-300';
                case 'severe': return 'bg-red-100 text-red-800 border-red-300';
                default: return 'bg-gray-100 text-gray-800 border-gray-300';
            }
        };

        const getHealthColor = (health) => {
            switch(health?.toLowerCase()) {
                case 'excellent': return 'text-green-600';
                case 'good': return 'text-lime-600';
                case 'fair': return 'text-yellow-600';
                case 'poor': return 'text-red-600';
                default: return 'text-gray-600';
            }
        };

        return (
            <div className="container mx-auto px-4 py-8 max-w-4xl">
                <div className="bg-white rounded-2xl shadow-xl p-8">
                    <div className="text-center mb-8">
                        <h1 className="text-4xl font-bold text-emerald-800 mb-2">🌱 Plant Nutrient Analyzer</h1>
                        <p className="text-gray-600">Upload a photo of your plant to detect nutrient deficiencies</p>
                    </div>

                    <div className="mb-6">
                        <label className="flex flex-col items-center justify-center w-full h-64 border-2 border-emerald-300 border-dashed rounded-xl cursor-pointer bg-emerald-50 hover:bg-emerald-100 transition-colors">
                            {imagePreview ? (
                                <img src={imagePreview} alt="Plant preview" className="h-full object-contain rounded-xl" />
                            ) : (
                                <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                    <svg className="w-16 h-16 mb-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                                    </svg>
                                    <p className="mb-2 text-sm text-gray-600"><span className="font-semibold">Click to upload</span> or drag and drop</p>
                                    <p className="text-xs text-gray-500">PNG, JPG or WEBP</p>
                                </div>
                            )}
                            <input type="file" className="hidden" accept="image/*" onChange={handleImageSelect} />
                        </label>
                    </div>

                    <button
                        onClick={analyzeImage}
                        disabled={!selectedImage || loading}
                        className="w-full bg-emerald-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-emerald-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors shadow-md"
                    >
                        {loading ? (
                            <span className="flex items-center justify-center">
                                <svg className="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24">
                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none" />
                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                                </svg>
                                Analyzing...
                            </span>
                        ) : 'Analyze Plant'}
                    </button>

                    {error && (
                        <div className="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                            <p className="text-red-700 text-sm">⚠️ {error}</p>
                        </div>
                    )}

                    {analysis && (
                        <div className="mt-8 space-y-6">
                            <div className="bg-gradient-to-r from-emerald-50 to-teal-50 p-6 rounded-xl border border-emerald-200">
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <p className="text-sm text-gray-600 mb-1">Plant Type</p>
                                        <p className="text-lg font-semibold text-emerald-800">{analysis.plantType}</p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-gray-600 mb-1">Overall Health</p>
                                        <p className={`text-lg font-semibold capitalize ${getHealthColor(analysis.overallHealth)}`}>
                                            {analysis.overallHealth}
                                        </p>
                                    </div>
                                </div>
                            </div>

                            {analysis.deficiencies && analysis.deficiencies.length > 0 && (
                                <div>
                                    <h3 className="text-xl font-bold text-gray-800 mb-4">🔍 Detected Deficiencies</h3>
                                    <div className="space-y-4">
                                        {analysis.deficiencies.map((def, idx) => (
                                            <div key={idx} className={`p-4 rounded-lg border-2 ${getSeverityColor(def.severity)}`}>
                                                <div className="flex justify-between items-start mb-2">
                                                    <h4 className="font-bold text-lg">{def.nutrient}</h4>
                                                    <span className="text-xs font-semibold px-2 py-1 rounded uppercase">
                                                        {def.severity}
                                                    </span>
                                                </div>
                                                <p className="text-sm mb-2">{def.symptoms}</p>
                                                <p className="text-xs opacity-75">Confidence: {def.confidence}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {analysis.recommendations && analysis.recommendations.length > 0 && (
                                <div>
                                    <h3 className="text-xl font-bold text-gray-800 mb-4">💡 Recommendations</h3>
                                    <div className="bg-blue-50 p-5 rounded-lg border border-blue-200">
                                        <ul className="space-y-2">
                                            {analysis.recommendations.map((rec, idx) => (
                                                <li key={idx} className="flex items-start">
                                                    <span className="text-blue-600 mr-2">•</span>
                                                    <span className="text-gray-700">{rec}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {analysis.additionalNotes && (
                                <div className="bg-gray-50 p-5 rounded-lg border border-gray-200">
                                    <h3 className="text-lg font-bold text-gray-800 mb-2">📝 Additional Notes</h3>
                                    <p className="text-gray-700">{analysis.additionalNotes}</p>
                                </div>
                            )}
                        </div>
                    )}
                </div>

                <div className="mt-8 text-center text-sm text-gray-600">
                    <p>Powered by Claude AI • For educational purposes</p>
                </div>
            </div>
        );
    }

    ReactDOM.render(<PlantAnalyzer />, document.getElementById('root'));
</script>
```

</body>
</html>
